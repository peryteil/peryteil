<!DOCTYPE html>
<html>
    <head>
        <title>Box</title>
        <style>
            .box {
                /* 콘텐스 너비 */
                width: 200px;
                /* 콘텐츠 높이 */
                height: 100px;
                /* 배경색 */
                background-color: lightskyblue;
                /* 테두리: 10px */
                border: 10px solid black;
                /* 안쪽 여백: 콘텐츠와 테두리 사이 */
                padding:20px;
                /* 바깥 여백: 아래만 20px */
                margin: 0px 0px  20px 0px;
            }

            .box2 {
                /* 콘텐츠 너비 */
                width: 200px;
                /* 콘텐츠 높이 */
                height: 100px;
                /* 배경색 */
                background-color: lightskyblue;
            }
        </style>
    </head>
    <body>
        <div class="box">
            <span>Say ho!</span>
        </div>
        <div class="box2">
        <span>Say ho!</span>
        </div>
    </body>
</html>
