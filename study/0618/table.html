<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        /* 전체 테이블 스타일 */
        table {
            /* 테이블 너비를 전체의 80%로 */
            width: 80%;
            /* 위/아래 여백 10px, 좌우 가운데 정렬 */
            margin: 10px auto 10px;
            /* 테두리 겨비지 않게 하나로 만듦 */
            border-collapse: collapse;
        }
        /* 셀 공통 스타일 (th와 td) */
        th,td {
            /* 셀 안쪽 여백 */
            padding: 10px;
            /* 연한 회색 테두리 */
            border: 1px solid #ddd;
            /* 왼쪽 정렬 */
            text-align: left;
        }
        /* 헤더 셀 스타일 */
        th {
            /* 밝은 회색 배경 */
            background-color: #f2f2f2;
        }
        /* 홀수 번째 행 배경색 설정 (1,3,5...) */
        tr:nth-child(odd) {
            /* 줄무늬 효과용 배경 */
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    
    <table>
        <tr>
            <th>번호</th>
            <th>이름</th>
            <th>연락처</th>
            <th>이메일</th>
            <th>0618</th>
            <th>0619</th>
        </tr>
        <tr>
            <td>1</td>
            <td>홍길동</td>
            <td>010-9876-5432</td>
            <td>hong@tmd.com</td>
            <td>100</td>
            <td></td>
        </tr>
        <tr>
            <td>2</td>
            <td>이순신</td>
            <td>010-9876-5433</td>
            <td>lee@tmd.com</td>
            <td>100</td>
            <td></td>
        </tr>
        <tr>
            <td>3</td>
            <td>임꺽정</td>
            <td>010-9876-5434</td>
            <td>lim@tmd.com</td>
            <td>100</td>
            <td></td>
        </tr>
    </table>
    
</body>
</html>
