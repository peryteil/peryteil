<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World!</title>
    <style>
        /* 명함 카드 스타일 */
        .card{
            /* 카드 너비 */
            width: 300px;
            /* 배경색 노랑 */
            background-color: yellow;
            /* 안쪽 여백 */
            padding: 20px;
            /* 가운데 정렬 */
            margin: auto;
            /* 모서리 둥글게 */
            border-radius: 10px;
            /* 글꼴 지정 */
            font-family: Arial, Helvetica, sans-serif;
            /* 텍스트 가운데 정렬 */
            text-align: center;
        }

    </style>
</head>
<body>
    <!-- 카드 본문 -->
    <div class="card">
        <h2>이재희</h2>
        <p>웹 프로튼엔드 개발자</p>
        <a href="mailto:me@example.com">이메일 보내기</a>
    </div>
</body>
</html>
