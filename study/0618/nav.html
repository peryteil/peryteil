<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 탭 UI</title>
    <style>
        /* 전체 페이지 스타일 */
      body {
        /* 글꼴 설정 */
        font-family: "Segoe UI", sans-serif;
        /* 바깥 여백 */
        padding: 40px;
        /* 배경 회색 */
        background-color: #f7f7f7;
      }
      /* 탭 전체를 감싸는 컨테이너 */
      .tab-container {
        /* 최대 너비 600px */
        max-width: 600px;
        /* 가운데 정렬 */
        margin: 0 auto;
        /* 배경 흰색 */
        background-color: white;
        /* 둥근 테두리 */
        border-radius: 8px;
        /* 그림자 */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        /* 안쪽 여백 */
        padding: 20px;
      }
      /* 라디오 버튼 숨기기 ( 탭처럼 보이게 하기 위해) */
      input[type="radio"] {
        display: none;
      }
      /* 탭 버튼(라벨)의 기본 스타일 */
      label {
        /* 가로로 나열 */
        display: inline-block;
        /* 안쪽 여백 */
        padding: 10px 20px;
        /* 탭 간 간격 */
        margin-right: 4px;
        /* 회색 배경 */
        background-color: #ddd;
        /* 마우스 포인터 변경 */
        cursor: pointer;
        /* 상단만 둥글게 */
        border-radius: 5px 5px 0 0;
        /* 배경색 부드럽게 변경 */
        transition: background-color 0.3s;
      }
      /* 선택된 탭 버튼 스타일 */
      input[type="radio"]:checked + label {
        /* 초록 배경 */
        background-color: #4caf50;
        /* 흰색 글씨 */
        color: white;
      }
      /* 콘텐츠 공통 스타일 */
      .content {
        /* 기본은 숨김 */
        display: none;
        /* 안쪽 여백 */
        padding: 20px;
        /* 위쪽 경계선 */
        border-top: 1px solid #ccc;
        /* 흰색 배경 */
        background-color: #fff;
        /* 아래 모서리 둥글게 */
        border-radius: 0 0 5px 5px;
      }

      /* 각각의 탭이 체크됐을 때 해당 content 보여주기 */
      #tab1:checked ~ #content1,
      #tab2:checked ~ #content2,
      #tab3:checked ~ #content3 {
        display: block;
      }
    </style>
  </head>
  <body>
    <!-- 탭 전체를 감싸는 영역 -->
    <div class="tab-container">
        <!-- 첫 번째 탭: HTML -->
      <input type="radio" id="tab1" name="tab" checked />
      <label for="tab1">HTML</label>
        <!-- 두 번째 탭: CSS -->
      <input type="radio" id="tab2" name="tab" />
      <label for="tab2">CSS</label>
        <!-- 세 번째 탭: JavaScript -->
      <input type="radio" id="tab3" name="tab" />
      <label for="tab3">JavaScript</label>
        <!-- HTML 탭에 대응하는 콘텐츠 -->
      <div class="content" id="content1">
        <h2>HTML</h2>
        <p>웹 페이지의 구조를 만드는 마크업 언어입니다.</p>
      </div>

      <!-- CSS 탭에 대응하는 콘텐츠 -->
      <div class="content" id="content2">
        <h2>CSS</h2>
        <p>웹 페이지에 스타일을 적용하는 언어입니다.</p>
      </div>
      <!-- JavaScript 탭에 대응하는 콘텐츠 -->
      <div class="content" id="content3">
        <h2>JavaScript</h2>
        <p>웹 페이지를 동적으로 만들어주는 스크립트 언어입니다.</p>
      </div>
    </div> 
  </body>
</html>
