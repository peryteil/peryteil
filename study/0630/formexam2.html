<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="text" id="orderName" placeholder="주문자 이름">
    <input type="text" id="shipName" placeholder="수령인 이름">
    <input type="checkbox" id="same" onclick="copyName()">
    <br>
    <input type="text" id="userName" placeholder="이름">
    <input type="number" id="userAge" placeholder="나이">
    <input type="sumit" id="submit" value="제출" onclick="validateForm">
    <br>

    <input type="radio" id="male" name="gender" value="male" onclick="validateGender()">
    <label for="male">남자</label>

    <input type="radio" id="female" name="gender" value="female" onclick="validateGender()">
    <label for="female">여자</label>

    <select id="country" onchange="validateCountry()">
        <option value="korea">한국</option>
        <option value="usa">미국</option>
        <option value="japan">일본</option>
    </select>

    <form id="signupForm">
        <input type="text" id="username" placeholder="이름 입력">
        <input type="email" id="email" placeholder="이메일 입력">
        <input type="password" id="password" placeholder="비밀번호 입력">
        <input type="password" id="confirmPassword" placeholder="비밀번호 확인">
        <button type="submit">가입</button>
    </form>

    <form id="myForm">
        <input type="email" required>
        <button>제출</button>
    </form>

    <script>

        document.getElementById("signupForm").addEventListener("submit", function (e){
            e.preventDefault();
            
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if(!username) {
                alert("이름을 입력하세요.");
                return;
            }
            const emailRegex = /^[\w.-]+@[\w.-]+\.[A-Za-z]{2,}$/;
            if (!emailRegex.test(email)) {
                alert("올바른 이메일을 입력하세요.");
                return;
            }
            if(password.length < 8) {
                alert("비밀번호는 8자 이상이어야 합니다.")
                return;
            }
            if(password !== confirmPassword) {
                alert("비밀번호가 일치하지 않습니다.")
                return;
            }
            alert("회원가입 성공!");

        });
        //  배송 정보 복사
        function copyName() {
            if (document.getElementById("same").checked) {
                document.getElementById("shipName").value =
                    document.getElementById("orderName").value;
            } else {
                document.getElementById("shipName").value = "";
            }
        }

        // 이름과 나이 유효성 검사
        function validateForm() {
            let name = document.getElementById("userName").value;
            let age = document.getElementById("userAge").value;

            if (name === "") {
                alert("이름을 입력하세요.");
                return false;
            }

            if (isNaN(age) || age < 1) {
                alert("나이를 올바르게 입력하세요.");
                return false;
            }
            alert("폼이 정상적으로 제출됩니다.");
            return true;
        }

        function validateGender() {
            let male = document.getElementById("male").checked;
            let female = document.getElementById("female").checked;

            if (male) {
                return document.getElementById("male").value;
            }
            console.log(male, female);
        }

        function validateCountry(){
            let country = document.getElementById("country").value;
        }
        

        

    </script>
</body>

</html>
