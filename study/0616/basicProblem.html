<html>

<head>
    <title>폼 관련 태그 문제 10선</title>
</head>

<body>


    <form>
        <fieldset>
            <form>
                <legend>회원가입 폼</legend>
                <!-- 1.사용자 이름과 이메일을 입력받는 폼을 만들어 보세요. -->
                <label for="name">이름</label>
                <input type="text" id="name" name="name" placeholder="이름을 입력해주세요.">
                <br>
                <br>

                <label for="email">이메일</label>
                <input type="email" id="email" name="emanil" placeholder="이메일을 입력해주세요.">
                <button type="submit">제출</button>
            </form>
            <br>
            <br>
            <!-- 2.비밀번호와 비밀번호 확인 입력 필드를 추가해보세요. -->
            <!-- 두 개의 <input type="password"> 필드를 생성하고, placeholder로 설명을 덧붙이세요. -->
            <form>
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력해주세요.">
                <label for="confirm_password">비밀번호 확인</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="비밀번호를 다시 입력해주세요.">
            </form>
            <br>
            <br>
            <!-- 3.생년월일을 입력받을 수 있도록 <input type="date"> 필드를 만들어보세요. -->
            <form>
                <label for="date"> 생년월일:</label>
                <input type="date" id="birth" name="birth" placeholder="생년월일을 입력해주세요.">
            </form>
            <br>
            <br>
            <!-- 4.뉴스레터 수신 여부를 체크박스로 구현해보세요.
             체크박스의 라벨은 "뉴스레터 수신에 동의합니다."로 작성하세요. -->
            <form>
                <label>
                    <input type="checkbox" name="newsletter">
                    뉴스레터 수신에 동의합니다.
                </label>
            </form>
            <br>
            <br>
            <!--5.성별을 선택할 수 있는 라디오 버튼 2개를 만들어보세요.
        예: 남자 / 여자
        name 속성은 동일하게 설정해야 함  -->
            <form>
                <lebel><input type="radio" name="gender" value="male">남자</lebel>
                <lebel><input type="radio" name="gender" value="female">여자</lebel>
            </form>
            <br>
            <br>
            <!-- 6.국가를 선택할 수 있는 <select> 태그를 만들어보세요.
        옵션: 대한민국, 미국, 일본
        대한민국이 기본 선택되도록 하세요. -->
            <form>
                <label for="country">국가:</label>
                <select name="country" id="country">
                    <option value="kr">대한민국</option>
                    <option value="us">미국</option>
                    <option value="jp">일본</option>
                </select>
            </form>
            <br>
            <br>
            <!--7.자기소개를 입력할 수 있는 <textarea> 필드를 만들어보세요.
        최소 4줄, 40글자 너비 이상으로 설정  -->
        <form>
            <label for="intro">자기소개</label>
            <textarea id="intro" name="intro" rows="4" cols="40"></textarea>
            </form>
            <br>
            <br>
            <!--8.파일 업로드 기능을 추가해보세요.

        프로필 사진을 업로드할 수 있도록 <input type="file"> 사용  -->
        <form>
            <label for="photo">프로필 사진:</label>
            <input type="file" id="photo" name="photo">
            </form>
            <!-- 9. 슬라이더로 음량을 조절하는 입력 필드를 만들어보세요.

        최소값 0, 최대값 100 -->
            <br>
            <br>
            <form>
            <input type="range" name="range" min="0" max="100">
            </form>
            <br>
            <br>
        </fieldset>
    </form>
</body>

</html>
