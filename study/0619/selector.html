<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom 구조 예시</title>
    <style>
        /* div 바로 아래에 있는 p 태그에 흰색 글자 적용 */
        div>p {
            color: white;
        }
        /* input 위에 마우스를 올렸을 때 배경색을 빨간색으로 */
        input:hover {
            background-color: red;
        }
        /* input에 포커스(클릭하거나 Tab으로 이동)했을 때 배경 파란색 */
        input:focus {
            background-color: blue;
        }
        /* input 클릭한 순간 (활성 상태일 때) 배경 노란색 */
        input:active {
            background-color: yellow;
        }
        /* src 속성이 "image"로 시작하는 이미지에 초록색 배경 적용 */
        img[src^="image"] {
            background-color: green;
        }
        /* p 태그 중 홀수 번째 자식에 빨간 배경 */
        p:nth-child(odd) {
            background-color: red;
        }
        /* p 태그 중 짝수 번째 자식에 파란 배경 */
        p:nth-child(even) {
            background-color: blue;
        }
        /* 부모의 첫 번째 자식이 p일 경우에만 녹색 배경 (주의: section > h1이 있어서 적용 안됨) */
        p:first-child {
            background-color: green;
        }
        /* 부모의 마지막 자식이 p일 경우에만 검정 배경 */
        p:last-child {
            background-color: black;
        }
        /* p태그중 2n + 1번째(1,3,5...)에 분홍 배경 (위의 odd와 동일한 결과) */
        p:nth-child(2n + 1) {
            background-color: pink;
        }
        /* div 바로 아래 p 중 홀수번째의 strong 태그에 주황색 굵은 글자 적용 */
        div>p:nth-child(2n + 1)>strong {
            font-weight: bold;
            color: orange;
        }
    </style>
</head>

<body>
    <section>
        <h1>
            <strong>제목 강조</strong>
        </h1>
        <!-- src가 "image"로 시작해서 초록 배경 적용됨 -->
        <img src="image.jpg" alt="예시 이미지">
        <div>
            <!-- p는 div의 자식이므로 흰색 글자 + 분홍 배경 + strong은 주황 글자 -->
            <p><strong>첫 번째 단락 강조</strong></p>
            <!-- 짝수 번째 p -> 파란 배경 + 흰 글자 -->
            <p><strong>두 번째 단락 강조</strong></p>
            <!-- 홀수 번째 p -> 분홍 배경 + 흰 글자 + strong 주황 -->
            <p><strong>세 번째 단락 강조</strong></p>
            <p><strong>세 번째 단락 강조</strong></p>
            <p><strong>세 번째 단락 강조</strong></p>
            <!-- 마지막 p -> 검정 배경 + 흰 글자 + 홀수 -> 분홍 + 주황 strong -->
            <p><strong>세 번째 단락 강조</strong></p>
            <!-- <input type="text"> -->
        </div>
    </section>
</body>

</html>
