<!-- 이 문서가 HTML5 문서임을 나타냄 -->
<!DOCTYPE html>
<!-- 문서의 주요 언어를 한국어로 설정 -->
<html lang="ko">

<head>
    <!-- 문자 인코딩을 UTF-8로 설정 (한글, 특수문자 등 깨지지 않게) -->
    <meta charset="UTF-8">
    <!-- 모바일 기기에서 화면을 기기 너비에 맞게 표시하고 기본 확대 비율을 1로 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 브라우저 탭에 표시될 문서 제목 -->
    <title>Semantic</title>
</head>
<!-- 전체 웹 페이지의 본문 영역 시작 -->
<body>
    <!-- 웹사이트의 헤더 영역: 주로 로고, 제목, 내비게이션 포함 -->
    <header>
        <!-- 가장 중요한 제목 (웹사이트 이름) -->
        <h1>My Website</h1>
        <!-- 내비게이션 메뉴 -->
        <nav>
            <ul>
                <!-- 링크 리스트 -->
                <li><a href="#">Home</a></li>
                <li><a href="#">Services</a></li>

            </ul>
        </nav>
    </header>
    <!-- 주요 콘텐츠 영역: 문서에서 하나만 사용 가능 -->
    <main>
        <!-- 특정 주제를 다루는 구역: 그룹화된 콘텐츠 -->
        <section>
            <!-- 두 번째 수준의 제목 -->
            <h2>About Us</h2>
            <!-- 소개 문장 -->
            <p>We are a web development company.</p>
        </section>
        <!-- 독립적인 콘텐츠 블록: 블로그 글, 뉴스ㆍ등으로 적합 -->
        <article>
            <!-- 세 번째 수준의 제목 -->
            <h3>How We Work</h3>
            <!-- 절차 설명 문장 -->
            <p>Our process starts with planning and ends with deployment.</p>
        </article>
    </main>
    <!-- 문서의 하단: 저작권 정보, 연락처, 추가 링크 등 포함 -->
    <footer>
        <!-- 저작권 표시 -->
        <p>&copy; 2025 My Website</p>
        <!-- 공백 문자로 띄워진 텍스트 예시 -->
        &nbsp;&nbsp;&nbsp; a &nbsp;&nbsp;&nbsp; a &nbsp;&nbsp;&nbsp; a
    </footer>
</body>

</html>
