org: peryteil
app: photo-optimizer-students11
service: photo-optimizer-students11

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-northeast-2
  deploymentBucket:
    name: tmd-genai1-students11
    blockPublicAccess: true
    serverSideEncryption: AES256
  memorySize: 1024
  timeout: 10
  environment:
    DEST_BUCKET: ${self:service}-optimized-bucket-${sls:stage}
    UPLOAD_BUCKET: ${self:service}-upload-bucket-${sls:stage}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
      Resource:
        - arn:aws:s3:::${self:provider.environment.UPLOAD_BUCKET}/*
        - arn:aws:s3:::${self:provider.environment.DEST_BUCKET}/*
functions:
  optimize:
    handler: handler.optimize
    events:
      - s3:
          bucket: ${self:provider.environment.UPLOAD_BUCKET}
          event: s3:ObjectCreated:*
          existing: true