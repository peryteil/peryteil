<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강의 목차</title>
    <style>
        .container {
            display: flex;
            /* 가로 방향 정렬 */
            flex-direction: row; 
            /* 카드 사이 간격 */
            gap: 10px;
            


        }

        .card {
            width: 200px;
            background-color: skyblue;
            margin: auto;
            padding: 20px;
            text-align: center;
            border: 2px solid red;;
        }

        ul {
            /* 점 없애기 */
            list-style-type: none;
            /* 왼쪽 여백 없애기 */
            padding-left: 0l
        }

        table td:first-child td {
            font-weight: bold;
            background-color: #f2f2f2;
        }

        table {
            width: 80%;
            margin: 10px auto 10px;
            border-collapse: collapse;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>강의 목차</h1>
    <ol>
        <li>수학</li>
        <li>과학</li>
        <li>컴퓨터</li>
        <li>미술</li>
    </ol>

    <ul>
        <li>수학</li>
        <li>과학</li>
        <li>컴퓨터</li>
        <li>미술</li>
    </ul>


    <div class="container">
        <div class="card">
            <h2>수학</h2>
        </div>
        <div class="card">
            <h2>과학</h2>
        </div>
        <div class="card">
            <h2>컴퓨터</h2>
        </div>
        <div class="card">
            <h2>미술</h2>
        </div>
    </div>

    <h2>Table</h2>

        <table border="1" width="500" height="500">
            <tr>
                <th>구분</th>
                <th>성인</th>
                <th>학생</th>
            </tr>
            <tr>
                <td>독서율</td>
                <td>65.3%</td>
                <td>94.9%</td>
            </tr>
            <tr>
                <td>연평균 독서량</td>
                <td>9.1%</td>
                <td>23.9%</td>
            </tr>
            <tr>
                <td>공공도서관 이용률</td>
                <td>28.2%</td>
                <td>64.9%</td>
            </tr>
        </table>


        <h2>SUMMER BEACH</h2>
        <div class="hero">
            <video autoplay loop muted>
            <!-- 비디오 파일 경로 및 형식 지정 -->
            <source src="https://videos.pexels.com/video-files/1409899/1409899-uhd_2560_1440_25fps.mp4" type="video/mp4">
        </video>
        </div>
</body>

</html>
